# XcodeGen project definition — the source of truth for the Xcode project.
# Regenerate after adding files or changing settings:  xcodegen generate
# StorageSense.xcodeproj is generated and git-ignored; never edit it by hand.

name: StorageSense

options:
  bundleIdPrefix: com.kayode
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "2600"

settings:
  base:
    # Pinned to Swift 5 language mode, matching the rest of the portfolio.
    SWIFT_VERSION: "5.0"
    # Kayode's Apple Developer team, baked in so Run/Archive work without
    # touching Signing & Capabilities by hand.
    DEVELOPMENT_TEAM: SJW465977U
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  StorageSense:
    type: application
    platform: iOS
    sources:
      - path: StorageSense
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kayode.storagesense
        PRODUCT_NAME: StorageSense
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: StorageSense
        # No encryption beyond what iOS provides — answers the export compliance question at upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "StorageSense reads your Photos library on-device to show you a plain-language breakdown of what's using your storage. Nothing ever leaves your phone."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  StorageSenseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StorageSenseTests
    dependencies:
      - target: StorageSense
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kayode.storagesense.tests
        GENERATE_INFOPLIST_FILE: YES

  StorageSenseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - StorageSenseUITests
    dependencies:
      - target: StorageSense
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kayode.storagesense.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: StorageSense

schemes:
  StorageSense:
    build:
      targets:
        StorageSense: all
        StorageSenseTests: [test]
        StorageSenseUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - StorageSenseTests
        - StorageSenseUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
